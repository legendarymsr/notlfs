music_directory    "/root/music"
playlist_directory "/root/.mpd/playlists"
db_file            "/root/.mpd/database"
state_file         "/root/.mpd/state"
bind_to_address    "127.0.0.1"
audio_output {
    type "alsa"
    name "ALSA"
    mixer_type "software"
}
audio_output {
    type   "fifo"
    name   "visualizer"
    path   "/tmp/mpd.fifo"
    format "44100:16:2"
}
