[ui]
styleset-name=tokyonight

[filters]
# aerc's stock filters (colorize, wrap) are not installed; plain tools instead
text/plain=cat
text/html=w3m -T text/html -dump -cols 100
message/delivery-status=cat
message/rfc822=cat

[viewer]
# aerc's default (less -Rc) fails with busybox less, which shows a blank page; busybox more works
pager=more
