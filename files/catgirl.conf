# catgirl config for Libera.Chat: run `catgirl libera`
# Copy to ~/.config/catgirl/ and edit for other networks. TLS is always on; catgirl verifies certificates.
# Libera.Chat requires SASL for connections from many networks (Tor, VPNs, some ISPs). Either set
# `sasl-plain = nick:password` below, or use a client certificate (`cert = ` + `sasl-external`), or
# run `catgirl oftc`, which needs no login at all.
host = irc.libera.chat
port = 6697
# nick = yournick
# join = #notlfs,#libera
# sasl-plain = yournick:password
# cert = /path/to/cert.pem   # CertFP: make one with `catgirl -g cert.pem`, then enable:
# sasl-external
# Use only the 16 terminal colors for nicks and channels, so they follow the Tokyo Night console palette
hash = 0,15
# Logs in ~/.local/share/catgirl/log
log
save = libera
