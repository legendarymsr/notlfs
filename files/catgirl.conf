# catgirl config for Libera.Chat: run `catgirl libera`
# Copy to ~/.config/catgirl/ and edit for other networks. TLS is always on; catgirl verifies certificates.
host = irc.libera.chat
port = 6697
# nick = yournick
# join = #notlfs,#libera
# sasl-plain = yournick:password
# Use only the 16 terminal colors for nicks and channels, so they follow the Tokyo Night console palette
hash = 0,15
# Logs in ~/.local/share/catgirl/log
log
save = libera
