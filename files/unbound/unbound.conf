# notlfs DNS: unbound on 127.0.0.1:53, every query forwarded over DNS-over-TLS (port 853)
server:
  interface: 127.0.0.1
  port: 53
  access-control: 127.0.0.0/8 allow
  do-ip6: no
  username: ""
  chroot: ""
  pidfile: ""
  directory: "/etc/unbound"
  use-syslog: no
  logfile: ""
  verbosity: 0
  num-threads: 1
  so-reuseport: no
  tls-cert-bundle: /etc/ssl/cert.pem
  hide-identity: yes
  hide-version: yes
  qname-minimisation: yes
  minimal-responses: yes
  prefetch: yes
  # .onion: unbound refuses it by default (RFC 7686); hand it to Tor's DNSPort instead,
  # which answers with a mapped 10.192.0.0/10 address (nftables sends that into Tor's TransPort)
  local-zone: "onion." nodefault
  domain-insecure: "onion."
  do-not-query-localhost: no
forward-zone:
  name: "."
  forward-tls-upstream: yes
  forward-addr: 9.9.9.9@853#dns.quad9.net
  forward-addr: 149.112.112.112@853#dns.quad9.net
  forward-addr: 194.242.2.2@853#dns.mullvad.net
forward-zone:
  name: "onion."
  forward-addr: 127.0.0.1@9053
