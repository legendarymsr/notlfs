# prefix stays C-b (C-a is QEMU -nographic escape)
bind | split-window -h
bind - split-window -v
set -g mouse on
set -g default-terminal tmux-256color
set -g status-style bg=magenta,fg=black
set -g status-left " notlfs "
set -g status-right " #(uname -r) "
set -g window-size latest
setw -g aggressive-resize on
