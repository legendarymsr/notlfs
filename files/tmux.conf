# notlfs tmux: a tiling "WM" on the console. Alt (Meta) binds, no prefix needed; prefix stays C-b.
# Keys: /etc/motd (Alt+? shows it)
set -g default-terminal tmux-256color
set -g mouse on
set -g escape-time 20
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows off
set -g window-size latest
setw -g aggressive-resize on
bind | split-window -h
bind - split-window -v

# --- tiling: every new pane re-tiles as dwm-like main-vertical (master left, stack right)
setw -g main-pane-width 55%
set-hook -g after-split-window 'select-layout main-vertical'
set-hook -g after-kill-pane 'select-layout main-vertical'
set-hook -g pane-exited 'select-layout main-vertical'
bind -n M-Enter split-window -h -c '#{pane_current_path}'
bind -n M-q kill-pane
bind -n M-f resize-pane -Z
bind -n M-Space next-layout
bind -n M-t select-layout main-vertical
# focus / swap
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-H select-pane -L \; swap-pane -s '!' \; select-pane -t '!'
bind -n M-J swap-pane -D
bind -n M-K swap-pane -U
bind -n M-L select-pane -R \; swap-pane -s '!' \; select-pane -t '!'
# resize: Alt+Ctrl+hjkl, or Alt+r then hjkl (Esc/Enter leaves)
bind -n M-C-h resize-pane -L 5
bind -n M-C-j resize-pane -D 3
bind -n M-C-k resize-pane -U 3
bind -n M-C-l resize-pane -R 5
bind -n M-r switch-client -T resize \; display-message 'resize: hjkl, Esc to leave'
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 3 \; switch-client -T resize
bind -T resize k resize-pane -U 3 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize Escape switch-client -T root
bind -T resize Enter switch-client -T root
# workspaces: Alt+1..9 go (created on demand), Alt+Shift+1..9 send the pane there
bind -n M-1 run 'tmux-ws go 1 #{session_name} #{pane_id}'
bind -n M-2 run 'tmux-ws go 2 #{session_name} #{pane_id}'
bind -n M-3 run 'tmux-ws go 3 #{session_name} #{pane_id}'
bind -n M-4 run 'tmux-ws go 4 #{session_name} #{pane_id}'
bind -n M-5 run 'tmux-ws go 5 #{session_name} #{pane_id}'
bind -n M-6 run 'tmux-ws go 6 #{session_name} #{pane_id}'
bind -n M-7 run 'tmux-ws go 7 #{session_name} #{pane_id}'
bind -n M-8 run 'tmux-ws go 8 #{session_name} #{pane_id}'
bind -n M-9 run 'tmux-ws go 9 #{session_name} #{pane_id}'
bind -n 'M-!' run 'tmux-ws move 1 #{session_name} #{pane_id}'
bind -n 'M-@' run 'tmux-ws move 2 #{session_name} #{pane_id}'
bind -n 'M-#' run 'tmux-ws move 3 #{session_name} #{pane_id}'
bind -n 'M-$' run 'tmux-ws move 4 #{session_name} #{pane_id}'
bind -n 'M-%' run 'tmux-ws move 5 #{session_name} #{pane_id}'
bind -n 'M-^' run 'tmux-ws move 6 #{session_name} #{pane_id}'
bind -n 'M-&' run 'tmux-ws move 7 #{session_name} #{pane_id}'
bind -n 'M-*' run 'tmux-ws move 8 #{session_name} #{pane_id}'
bind -n 'M-(' run 'tmux-ws move 9 #{session_name} #{pane_id}'
# apps
bind -n M-d display-popup -E -w 50% -h 60% -b rounded -S fg=blue -T ' run ' launch
bind -n M-e split-window -h -c '#{pane_current_path}' lf
bind -n M-b split-window -h 'w3m https://lite.duckduckgo.com/lite/'
bind -n M-w display-popup -E -w 60% -h 60% -b rounded -S fg=blue -T ' wifi ' wifi
bind -n M-? display-popup -E -w 70% -h 80% -b rounded -S fg=magenta -T ' keys ' 'less /etc/motd'

# --- Tokyo Night bar (ANSI indices: the VT palette makes them Tokyo Night)
set -g status-interval 5
set -g status-style bg=black,fg=white
set -g status-left "#[bg=blue,fg=black,bold] notlfs #[default] "
set -g status-left-length 20
set -g status-right-length 80
set -g status-right "#[fg=yellow]#(cut -d' ' -f1-3 /proc/loadavg) #[fg=green]#(tmux-bat)#[fg=cyan]%a %d %b #[bg=magenta,fg=black,bold] %H:%M "
setw -g window-status-format "#[fg=brightblack] #I#{?window_zoomed_flag,+,} "
setw -g window-status-current-format "#[bg=blue,fg=black,bold] #I#{?window_zoomed_flag,+,} "
setw -g window-status-separator ''
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=blue
set -g popup-border-style fg=blue
set -g message-style bg=black,fg=cyan
set -g mode-style bg=brightblack,fg=white
set -g display-panes-colour brightblack
set -g display-panes-active-colour blue
setw -g clock-mode-colour blue
