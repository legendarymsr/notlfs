# prefix stays C-b (C-a is QEMU -nographic escape)
bind | split-window -h
bind - split-window -v
set -g mouse on
set -g default-terminal tmux-256color
set -g status-left " notlfs "
set -g status-right " #(uname -r) "
set -g window-size latest
setw -g aggressive-resize on
# Tokyo Night (ANSI indices: the VT palette maps them to Tokyo Night colors)
set -g status-style bg=black,fg=white
set -g status-left "#[bg=blue,fg=black,bold] notlfs #[default] "
set -g status-left-length 20
set -g status-right "#[fg=brightblack]%H:%M #[bg=magenta,fg=black,bold] #(uname -r) "
setw -g window-status-format "#[fg=brightblack] #I:#W "
setw -g window-status-current-format "#[fg=cyan,bold] #I:#W "
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=blue
set -g message-style bg=black,fg=cyan
set -g mode-style bg=brightblack,fg=white
set -g display-panes-colour brightblack
set -g display-panes-active-colour blue
setw -g clock-mode-colour blue
