#!/usr/sbin/nft -f
# notlfs firewall: default-deny inbound and forwarded, outbound open.
# /init adds "tcp dport 22 accept" while the dropbear service is enabled.
flush ruleset
table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif lo accept
    udp sport 67 udp dport 68 accept comment "dhcp replies"
    icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 10/second accept
    icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
  }
  chain forward {
    type filter hook forward priority filter; policy drop;
  }
  chain output {
    type filter hook output priority filter; policy accept;
  }
}
# .onion out of the box: Tor maps onion names to 10.192.0.0/10 (torrc VirtualAddrNetworkIPv4),
# connections to those addresses go into Tor's TransPort. Nothing else is redirected.
table ip toronion {
  chain out {
    type nat hook output priority -100; policy accept;
    ip daddr 10.192.0.0/10 meta l4proto tcp redirect to :9040
  }
}
